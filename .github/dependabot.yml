version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - python:uv
      - chore
    groups:
      python-dependencies:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - chore
    groups:
      github-actions:
        patterns:
          - "*"

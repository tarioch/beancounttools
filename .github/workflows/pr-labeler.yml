# Synced from https://github.com/tarioch/repo-sync/blob/main/config/workflows/pr-labeler.yml
# Do not edit here, the next sync overwrites it. Change it in repo-sync.
name: PR Labeler
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions: {}

jobs:
  pr-labeler:
    name: Label check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - if: github.event.pull_request.head.repo.full_name == github.repository
        uses: TimonVS/pr-labeler-action@f9c084306ce8b3f488a8f3ee1ccedc6da131d1af # v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # the pull requests of the sync action (repo-sync) come from branches without a prefix (workflow-files-sync...),
      # but all their titles start with "chore:", so a chore title gives the label if the branch did not
      - name: Label chore titles as chore
        if: >-
          github.event.pull_request.head.repo.full_name == github.repository &&
          startsWith(github.event.pull_request.title, 'chore:')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          labels=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" --jq '.[].name')
          for label in feature bugfix chore; do
            if printf '%s\n' "$labels" | grep -qx "$label"; then
              exit 0
            fi
          done
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" -f 'labels[]=chore' --silent

      # the label decides the release notes category, a PR from a branch without a known prefix needs one set by hand
      # (read from the API, the event payload does not contain the label the step above just added)
      - name: Require a release notes category label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          labels=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" --jq '.[].name')
          for label in feature bugfix chore; do
            if printf '%s\n' "$labels" | grep -qx "$label"; then
              exit 0
            fi
          done
          echo "::error::add one of the labels feature, bugfix or chore (or use a feature/, bugfix/ or chore/ branch)"
          exit 1
